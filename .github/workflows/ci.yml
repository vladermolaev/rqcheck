# The matrix is the point. rqcheck.sh leans on `sort -V` detection, `paste -sd`,
# `xargs -0`, `grep -o`, `sed -E` backreferences and bash 3.2 semantics, and BSD
# against GNU divergence there is the failure a single-platform run does not
# find. macOS ships bash 3.2 as /bin/bash and BSD userland; Linux ships bash 5
# and GNU coreutils.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  # The tolerated job below builds reqflow from master, so it only reports
  # something once upstream has moved. A weekly run is what surfaces that
  # without waiting for a commit here.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

env:
  # The release the interface check's assertions were written against. The
  # check itself is behavioural and compares no version, so this pin makes the
  # run reproducible rather than making the tool version-specific. The tag
  # leaves AC_INIT at 1.6.0, so the binary reports itself as Reqflow 1.6.0,
  # which is the string the check names.
  REQFLOW_REF: v1.6.1
  BATS_REF: v1.13.0

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck every shell file
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --version
          # Profiles are sourced rather than executed, so they carry no
          # shebang and shellcheck needs telling what they are. The directive
          # is in each file, so the invocation stays uniform.
          find . -name '*.sh' -print0 | xargs -0 shellcheck -S warning

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Record the shell the suite will run under
        run: |
          set -euo pipefail
          bash --version | head -1
          uname -a

      - name: Cache the reqflow build
        id: reqflow-cache
        uses: actions/cache@v4
        with:
          path: reqflow/build/reqflow
          key: reqflow-${{ matrix.os }}-${{ env.REQFLOW_REF }}

      - name: Install reqflow's libraries
        run: |
          set -euo pipefail
          # reqflow is GNU Autotools, not CMake, and every library below is a
          # hard requirement: configure.ac calls PKG_CHECK_MODULES with no
          # action-if-not-found, so a missing one aborts configure rather than
          # dropping a format. reqflow links them dynamically, so the cached
          # binary needs them present as much as a fresh build does and this
          # step runs on a cache hit too.
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq \
              autoconf automake libtool pkg-config \
              libzip-dev libxml2-dev libpoppler-cpp-dev libpcre3-dev
          else
            brew install autoconf automake libtool pkg-config libzip libxml2 poppler pcre
          fi

      - name: Build reqflow
        if: steps.reqflow-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$REQFLOW_REF" https://github.com/goeb/reqflow.git reqflow
          cd reqflow
          # A release tag carries the autoreconf output, configure among it, so
          # there is nothing to bootstrap here. bootstrap.sh exists on master,
          # where the generated files are not in version control.
          #
          # git stamps a checkout in the order it writes the files, so
          # configure.ac can land microseconds after aclocal.m4, and automake's
          # rebuild rules then reach for the aclocal-1.15 that generated them,
          # which no runner carries. Stamping the generated files in dependency
          # order settles that before make looks. A make that compares whole
          # seconds, 3.81 as shipped on macOS, never sees the difference, so
          # this is the GNU leg's failure alone.
          touch aclocal.m4
          touch configure src/config.h.in
          touch Makefile.in test/Makefile.in
          mkdir -p build && cd build
          if [ "$RUNNER_OS" = macOS ]; then
            # libxml2 is keg-only on Homebrew, so its .pc file is not on the
            # default search path. poppler's .pc names include/poppler/cpp
            # while the sources include <poppler/cpp/poppler-document.h>, so
            # the Homebrew include root has to be on the path as well.
            export PKG_CONFIG_PATH="$(brew --prefix libxml2)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            export CPPFLAGS="-I$(brew --prefix)/include${CPPFLAGS:+ $CPPFLAGS}"
          fi
          # src/req.cpp initialises an array from a brace list with no '=',
          # which is C++11, and Apple clang still defaults g++ to gnu++98. The
          # two optimisation flags are configure's own default, which naming
          # CXXFLAGS would otherwise drop.
          ../configure CXXFLAGS="-std=gnu++11 -g -O2"
          make -j2

      - name: Install bats-core
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$BATS_REF" https://github.com/bats-core/bats-core.git
          sudo ./bats-core/install.sh /usr/local
          bats --version

      - name: Validate the plugin and marketplace manifests
        run: |
          set -euo pipefail
          python3 -c 'import json,sys; [json.load(open(p)) for p in sys.argv[1:]]' \
            .claude-plugin/plugin.json .claude-plugin/marketplace.json
          # The two must agree on the plugin name, since the marketplace entry
          # is what an install resolves and the manifest is what it then loads.
          python3 - <<'PY'
          import json
          p = json.load(open('.claude-plugin/plugin.json'))
          m = json.load(open('.claude-plugin/marketplace.json'))
          names = [e['name'] for e in m['plugins']]
          assert p['name'] in names, (p['name'], names)
          PY

      - name: Run the suite
        env:
          REQFLOW: ${{ github.workspace }}/reqflow/build/reqflow
        run: bats skills/rqcheck/test/rqcheck.bats

      - name: Run the suite from outside any git repository
        env:
          REQFLOW: ${{ github.workspace }}/reqflow/build/reqflow
        run: |
          set -euo pipefail
          # A per-user install has no repository above it, and the root
          # derivation is what a wrong install would get wrong, so the whole
          # suite runs once with the checkout copied out of git's reach.
          dest="$(mktemp -d)/rqcheck"
          mkdir -p "$dest"
          cp -R skills "$dest/"
          cd "$dest"
          git rev-parse --show-toplevel && exit 1 || true
          bats skills/rqcheck/test/rqcheck.bats

  # Upstream has promised none of the output shapes this tool reads, so this
  # job is the early warning rather than a gate. It fails when reqflow's master
  # moves a shape, and the interface check inside rqcheck.sh is what names
  # which one.
  reqflow-master:
    continue-on-error: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build reqflow from master and run the interface check
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake libtool pkg-config \
            libzip-dev libxml2-dev libpoppler-cpp-dev libpcre3-dev
          git clone --depth 1 https://github.com/goeb/reqflow.git reqflow
          cd reqflow && ./bootstrap.sh && mkdir -p build && cd build
          ../configure CXXFLAGS="-std=gnu++11 -g -O2" && make -j2
          cd "$GITHUB_WORKSPACE"
          REQFLOW="$PWD/reqflow/build/reqflow" \
          RQ_PROFILE="$PWD/skills/rqcheck/profiles/bmad-stock.sh" \
          RQ_ARTIFACTS="$PWD/skills/rqcheck/test/fixtures/stock" \
            ./skills/rqcheck/rqcheck.sh doctor
